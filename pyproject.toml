[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-operations-analytics"
version = "0.1.0"
description = "Synthetic hospital appointment analytics and no-show risk system"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

