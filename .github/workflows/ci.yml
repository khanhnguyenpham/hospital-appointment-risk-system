name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài dependencies
        run: pip install -r requirements-dev.txt
      - name: Kiểm tra code
        run: ruff check .
      - name: Tái lập dữ liệu và model
        run: python run_pipeline.py
      - name: Chạy test
        run: pytest
      - name: Smoke test API
        run: python -c "from fastapi.testclient import TestClient; from api import app; assert TestClient(app).get('/health').json()['status'] == 'ready'"
