services:
  - type: web
    name: appointment-risk-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python run_pipeline.py
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
